name: Fuzz nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [lint, fix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The nightly date is also pinned in ci.yml and AGENTS.md; bump all three together.
      - run: rustup toolchain install nightly-2026-11-03 --profile minimal
      # taiki-e/install-action has no manifest for cargo-fuzz, so build it from source.
      - run: cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz for 15 minutes
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "corpus/$TARGET"
          cargo +nightly-2026-11-03 fuzz run "$TARGET" "corpus/$TARGET" ../tests/fixtures/1x ../tests/fixtures/edge -- -max_total_time=900
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
