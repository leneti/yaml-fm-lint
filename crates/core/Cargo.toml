[package]
name = "yaml-fm-lint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
invariants = []

[dependencies]
saphyr-parser = "0.4.1"
jsonschema = { version = "0.60.2", default-features = false }
serde_json = "1.0.154"
regex = "1.13.1"
thiserror = "2.0.21"
jsonc-parser = { version = "0.34.0", default-features = false, features = ["serde"] }
globset = { version = "0.4.21", default-features = false }

[dev-dependencies]
rstest = "0.29.0"
insta = { version = "1.49.0", features = ["glob"] }
proptest = "1.12.0"
schemars = "1.2.3"
yaml-fm-lint-core = { path = ".", features = ["invariants"] }
