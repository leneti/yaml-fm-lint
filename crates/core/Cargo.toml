[package]
name = "yaml-fm-lint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
invariants = []

[dependencies]
saphyr-parser = "0.3.3"
jsonschema = { version = "0.60.2", default-features = false }
serde_json = "1.0.154"
regex = "1.13.1"
thiserror = "2.0.21"

[dev-dependencies]
rstest = "0.28.0"
insta = { version = "1.49.0", features = ["glob"] }
proptest = "1.12.0"
