[package]
name = "yaml-fm-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lint the YAML front matter of markdown files"
publish = false

[[bin]]
name = "yaml-fm-lint"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
yaml-fm-lint-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
globset = "0.4.22"
anstream = "1.0.0"
anstyle = "1.0.14"
annotate-snippets = "0.12.17"
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
insta = "1.49.0"
jsonschema = { version = "0.60.2", default-features = false }
toml = "1.2.2"
regex = "1.13.1"
schemars = "1.2.3"

[lints]
workspace = true
