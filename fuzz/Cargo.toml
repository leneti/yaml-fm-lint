[package]
name = "yaml-fm-lint-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
yaml-fm-lint-core = { path = "../crates/core", features = ["invariants"] }

[[bin]]
name = "lint"
path = "fuzz_targets/lint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fix"
path = "fuzz_targets/fix.rs"
test = false
doc = false
bench = false

[workspace]
