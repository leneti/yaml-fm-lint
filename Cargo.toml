[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/leneti/yaml-fm-lint"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
